[workspace]
members = [
    "crates/statelink-protocol",
    "crates/statelink-core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Gokul Kartha"]
repository = "https://github.com/karthagokul/statelink"
rust-version = "1.79"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
