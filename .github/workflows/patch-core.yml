name: One-time core cleanup

on:
  push:
    branches:
      - feat/rust-core-v0.1

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/rust-core-v0.1
      - uses: dtolnay/rust-toolchain@1.85
        with:
          components: rustfmt
      - name: Apply cleanup
        run: |
          python3 scripts/fix_core.py
          cargo fmt --all
          rm scripts/fix_core.py
          rm .github/workflows/patch-core.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: clean up StateLink core lints"
          git push origin HEAD:feat/rust-core-v0.1
